name: Publish Packages

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Optional package to publish (for example @banegasn/m3-navigation-rail)'
        required: false
        type: string
      registry_target:
        description: 'Publish to npm only or to both registries'
        required: true
        type: choice
        options:
          - both
          - npm
        default: both

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable pinned pnpm with Corepack
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          corepack install --global pnpm@11.12.0
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "11.12.0"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Publish to NPM Registry
        run: pnpm run publish:npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_PACKAGE_NAME: ${{ inputs.package_name }}

      - name: Configure GitHub Packages registry
        if: ${{ inputs.registry_target != 'npm' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@banegasn'

      - name: Publish to GitHub Packages
        if: ${{ inputs.registry_target != 'npm' }}
        run: pnpm run publish:github
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_PACKAGE_NAME: ${{ inputs.package_name }}
